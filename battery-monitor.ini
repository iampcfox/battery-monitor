; Battery Monitor 设置 —— 绝大多数项可以直接在程序里改：
;   卡片 Ctrl+右键 / 任务栏窄条右键 / 托盘右键 → 打开面板
; 那个面板里改完点"保存并应用"就立刻生效，同时写回这个文件；手改这个文件则需要重启。
; scale: 整体缩放，1 = 宽 144；高 54(只有电量) / 69(+温度) / 84(+温度+状态)；
;        蓝牙设备每台 +17（电池高 12.5，行距要够），并且与上面两组本机信息之间
;        另留 5 的空隙（分组，免得看着连成一片）
; marginright/marginbottom: 距离屏幕工作区右下角的边距（像素）
; refresh: 刷新间隔（秒）
; alpha: 卡片不透明度 0-255（0 全透明，165 约 2/3，255 完全不透明；数值越大越"实"）
; bgtop / bgbottom: 卡片底色，支持 "242,244,248" 或 "#F2F4F8"；两行填一样的值 = 纯平色块
;                    填不同值则恢复竖向渐变；两者平均亮度 >140 时自动用深墨色文字，否则用浅白字
; percent: 是否显示 % 号
; showtemp: 是否在悬浮窗口显示温度行
; showstate: 是否显示充放电状态词（充电中 / 放电中 / 已充满 / 未充电）
; showwatt: 是否在状态行后面加功率，形如"充电中 6.2W"
;           本机电池驱动不提供速率，只有按容量跳变估算的值，通常要等 1 到 2 分钟才出第一个数；
;           算不出来时写 0.0W（不留空白，免得看着像这行坏了）
;           注：上面这几项都在 设置面板 → 悬浮窗口 里勾选，右键菜单只管显不显示窗口。
; showbt: 是否显示蓝牙设备电量。一台设备一行：行首是设备类型图标（耳机/键盘/手柄/鼠标），
;         接着是设备名，最右边是一个"电池胶囊"，电量数字写在电池里（跟手机状态栏一样），
;         电池内腔按电量从左往右填绿（跟充电圆环同一个绿），100% 时整个填满。
;         电量取自系统给蓝牙设备记的 DEVPKEY_Bluetooth_Battery（就是设置界面显示的那个数）；
;         只显示"当前正连着"的设备：断开后那几行自动消失、卡片自动变矮，不留旧数字。
;         "连没连"问的是系统的实时链路状态（只在设置里配对过、但当前没连的设备，设备节点
;         依然在、电量还是上次的旧值，光看设备树会误判成连着）。这一步在后台线程做，
;         断开后最多十来秒那行消失，重新连上也会自己回来；查不出状态的按"连着"处理。
;         同类型的多台设备（两把键盘、两个手柄）会在名字后面带序号：键盘1 / 键盘2，序号按蓝牙地址固定。
;         系统不上报电量的设备（多数蓝牙手柄）电池里只画一个小圆点，表示"连着但没有电量数字"。
;         最多摊开 5 台，再多折成一行"还有 N 台"。
scale=1
marginright=16
marginbottom=16
refresh=5
alpha=208
bgtop=242,244,248
bgbottom=242,244,248
percent=true
showtemp=true
showstate=false
showwatt=false
showbt=true
; tray: 是否显示任务栏右下角的托盘图标（电池胶囊，随电量填色，充电时带小闪电；
;       鼠标悬停显示"电量 + 温度"）。
;       原 battery-tray 项目已并入本程序，这里 true 就是"卡片 + 托盘"一起跑；
;       写 false 就只剩卡片，行为和合并之前一样。
;       托盘右键菜单和卡片 Ctrl+右键菜单是同一套开关，改哪边都一样；
;       托盘双击 = 显示/隐藏卡片（卡片藏起来后仍在后台采样、照常记历史）。
tray=true
; taskbar: 任务栏窄条 —— 把一个小窗口 SetParent 进 Shell_TrayWnd，贴在托盘区左边，
;          上行是电池图标 + 电量，下行是温度 · 功率（两项都关掉就只剩上行，电量自己居中）。
;          跟 TrafficMonitor 的任务栏窗口是同一个路子：不是 deskband，不写注册表，
;          任务栏自动隐藏/全屏时它跟着任务栏一起走，不用额外处理。
;          位置是按 TrayNotifyWnd 实时算的，任务栏居中/左对齐、分辨率变化都会自己跟上。
;          空隙不够时依次省掉：多出来的蓝牙设备 → 功率 → 温度（本机电量永远保留），不会被切掉半截。
taskbar=true
; striptemp / stripwatt: 窄条下行显示哪几项。跟悬浮窗口的温度/功率是两套开关 ——
;          悬浮窗口想看温度、任务栏只想看电量，这种组合才配得出来。
;          老版本的 ini 没有这两行，程序会按 showtemp/showwatt 各继承一次。
striptemp=true
stripwatt=false
; stripbt: 窄条上行要不要带上蓝牙设备（耳机 / 键盘 / 鼠标 / 手柄）的电量。
;          每台设备是"行首图标 + 百分比"，跟本机电量排在一行；没上报电量的设备显示 --。
;          只统计当下连着的那几台，断开就自动消失。设备多、任务栏地方小时会按台数依次让位。
stripbt=true
; showemptybt: 是否显示"系统没上报电量"的设备（蓝牙音箱这类通常永远不报）。
;              false = 不显示（默认）：窄条和悬浮窗里都看不到它，只在面板的"设备电量"页里有；
;              true  = 照常显示，电量位置写 --。
showemptybt=false
; horizontal: 悬浮窗排列。false = 纵向（默认，电量在上、设备在下）；
;            true  = 横向（电量在最右、温度居中、蓝牙设备在左，一台一行）。
horizontal=true
; stripsolid: 窄条的画法。false = 逐像素透明（默认，背景真透，云母/壁纸都能透出来）；
;             true = 实底（背景填成任务栏底色，文字照画）。万一透明那套在你的机器上
;             表现为"看不见/花屏"，把它改成 true 就能立刻看到内容，只损失透明效果。
stripsolid=false
; traymin: 托盘图标取谁的电量。false = 只看本机；true = 本机 + 已连接蓝牙设备里最低的那个
;          （图标画的是电池图形，具体百分比在鼠标悬停提示和旁边的窄条里）
traymin=false
; trayicon: 托盘图标的画法。glyph = 电池胶囊（默认，描边跟着系统深浅色走，电量按比例填色，
;          充电时整格填绿 + 小闪电；跟任务栏窄条是同一套造型）；
;          number = 老样子的大号数字（16px 下笔画会发糊，觉得不像系统图标时可换回去对比）。
trayicon=glyph
; lowwarn: 低电量提醒阈值（%）。掉到该值时托盘弹一次气泡，充上电或回血后才会再次提醒；0 = 不提醒
lowwarn=0
; dragctrl: 拖动方式。true = 按住 Ctrl 再拖（默认，穿透点击不会误触下层窗口）；false = 直接按住卡片拖
;           （卡片是鼠标穿透的，直接拖会同时点到下面的窗口，所以默认要求 Ctrl）
;           拖过的位置记在同目录 battery-monitor.pos，删掉该文件即回到右下角默认位置
dragctrl=true
; debug: 是否把每次采样的原始值写进 battery-monitor.log（变化时写一行、另外每 60 秒一行心跳）
;        日志只留最后 300 行，用来核对"程序到底有没有在跑、数据源有没有变化"
debug=true
; recordmin: 历史统计的采样间隔，单位分钟，默认 5（面板 → 历史统计 里看曲线）
; historydays: 历史保留天数，默认 30；数据写在同目录 battery-monitor-history.csv
;             蓝牙设备另存 battery-monitor-history-bt.csv —— 只记当时连着、并且系统报了电量的那几台，
;             断开期间不写行，曲线那一段自然就是空的。历史统计页把电量、温度、每台蓝牙设备画在
;             一张图上：电量走左轴（0–100%），温度走右轴（范围按数据自动定）。
;             （面板 → 历史管理 里可以导出 csv、清空记录、打开所在文件夹）
recordmin=8
historydays=29
theme=0
